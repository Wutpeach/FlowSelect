<script>
// ---------------------------------------------------------------------------
// EXACT copy of VERTEX_SHADER_SOURCE from ExpandedPresentationSurface.tsx
// ---------------------------------------------------------------------------
const VERT = `#version 300 es
precision highp float;
const vec2 POSITIONS[3] = vec2[3](
  vec2(-1.0, -1.0),
  vec2(3.0, -1.0),
  vec2(-1.0, 3.0)
);
out vec2 vUv;
void main() {
  vec2 position = POSITIONS[gl_VertexID];
  vUv = position * 0.5 + 0.5;
  gl_Position = vec4(position, 0.0, 1.0);
}`;

// ---------------------------------------------------------------------------
// EXACT copy of FRAGMENT_SHADER_SOURCE from ExpandedPresentationSurface.tsx
// (includes the REPAIRED Lab-only Paper processed-silhouette mode)
// ---------------------------------------------------------------------------
const FRAG = `#version 300 es
precision highp float;
in vec2 vUv;
out vec4 outColor;
uniform vec2 uResolution;
uniform float uTime;
uniform float uProgress;
uniform int uProgressMode;
uniform bool uReducedMotion;
uniform float uActivationAge;
uniform int uActivationKind;
uniform vec2 uActivationOrigin;
uniform int uHeatmapMode;
uniform int uRefractionMode;
// Lab-only Paper processed-silhouette mode: the canvas spans the 228x228
// outer domain and the exact 200x200/r16 panel sits at outer origin (14,14)
// (uPaperPanelOrigin/uPaperPanelSize/uPaperPanelRadius are derived from the
// MAIN_WINDOW_* geometry constants and the canvas CSS size). The one lazy
// Lab-only processed RGBA texture holds R=exact panel source coverage,
// G=big broad field, B=narrow field, A=contour edge response. Production
// never sets uPaperMode.
uniform int uPaperMode;
uniform vec2 uPaperPanelOrigin;
uniform vec2 uPaperPanelSize;
uniform float uPaperPanelRadius;
uniform sampler2D uPaperBoundary;
// Lab-gated Heatmap spike: the restored baseline field is fully analytic
// (plane front + value-noise bend + rounded-rect SDF + 2D gaussian core), so
// it needs NO texture, preprocessing, or framebuffer. See
// research/paper-shaders-heatmap-checkpoint-b.md,
// research/paper-shaders-heatmap-checkpoint-c.md,
// research/mr9-rounded-boundary-edge-capture-spike.md and
// research/mr9-edge-repair.md.
// Renderer-local projection of the real Main Window rounded shell: the
// visible panel is 200x200 CSS with a 16px continuous-corner radius
// (MAIN_WINDOW_FULL_PANEL_RADIUS / MAIN_WINDOW_PANEL_SIZE), and the DOM clips
// this canvas to that rounded rect. uCornerRadius = 16/200 = 0.08 in
// normalized UV. Lab-gated Heatmap spike only; production never sets it.
uniform float uCornerRadius;
uniform vec3 uThermalVoid;
uniform vec3 uThermalDeep;
uniform vec3 uThermalEmber;
uniform vec3 uThermalFlare;
uniform vec3 uThermalGold;
uniform vec3 uThermalCore;

float arcMask(float angle, float amount) {
  return step(angle, clamp(amount, 0.0, 1.0));
}

float ring(vec2 point, float radius, float width) {
  return 1.0 - smoothstep(width, width * 1.8, abs(length(point) - radius));
}

float angularDistance(float left, float right) {
  return abs(fract(left - right + 0.5) - 0.5);
}

float edgeMask(vec2 uv, float width) {
  float edgeDistance = min(min(uv.x, 1.0 - uv.x), min(uv.y, 1.0 - uv.y));
  return 1.0 - smoothstep(width, width * 1.8, edgeDistance);
}

float perimeterCoordinate(vec2 uv) {
  float left = uv.x;
  float right = 1.0 - uv.x;
  float bottom = uv.y;
  float top = 1.0 - uv.y;
  float nearest = min(min(left, right), min(bottom, top));
  if (nearest == bottom) return uv.x * 0.25;
  if (nearest == right) return 0.25 + uv.y * 0.25;
  if (nearest == top) return 0.5 + (1.0 - uv.x) * 0.25;
  return 0.75 + (1.0 - uv.y) * 0.25;
}

float phasePulse(float phase, float start, float peak, float end) {
  return smoothstep(start, peak, phase) * (1.0 - smoothstep(peak, end, phase));
}

// ---- Heatmap spike (lab-gated): Checkpoint C travelling surface field +
// Rounded Boundary Edge Capture, with the MR9 material/palette/edge repair. ----
// Clean-room Ameow spike. No Paper source is copied or adapted; the only
// shared high-level idea is "scalar heat -> thermal color ramp" (an
// unprotectable visual technique). The motion/contact grammar is restored
// from the archived Checkpoint B/C + rounded-boundary edge-capture evidence
// (research/paper-shaders-heatmap-checkpoint-b.md,
// research/paper-shaders-heatmap-checkpoint-c.md,
// research/mr9-rounded-boundary-edge-capture-spike.md); the palette/material/
// edge repair is documented in research/mr9-edge-repair.md. This stays inside
// Ameow's single canvas/program/runtime/draw authority and is lab-gated only.
//
// ---- Low-frequency value noise (pre-existing Ameow spike helper) ----
float heatmapNoise(vec2 p) {
  vec2 i = floor(p);
  vec2 f = p - i;
  vec2 u = f * f * (3.0 - 2.0 * f);
  float a = abs(fract(sin(dot(i, vec2(127.1, 311.7))) * 43758.5453123));
  float b = abs(fract(sin(dot(i + vec2(1.0, 0.0), vec2(127.1, 311.7))) * 43758.5453123));
  float c = abs(fract(sin(dot(i + vec2(0.0, 1.0), vec2(127.1, 311.7))) * 43758.5453123));
  float d = abs(fract(sin(dot(i + vec2(1.0, 1.0), vec2(127.1, 311.7))) * 43758.5453123));
  return mix(mix(a, b, u.x), mix(c, d, u.x), u.y);
}

// Multi-scale, very-low-frequency, slow whole-field deformation (Checkpoint C
// 2a, accepted as-is). Reduced Motion pins time to 0 so the deformation is a
// fixed static snapshot with no travelling frames.
float heatmapBend(vec2 pos, float time) {
  float swell = heatmapNoise(pos * 0.8 + vec2(time * 0.09, -time * 0.05)) - 0.5;
  float curl  = heatmapNoise(pos * 1.6 + vec2(-time * 0.04, time * 0.07)) - 0.5;
  return swell * 0.13 + curl * 0.05;
}

// Sine-free polynomial hash for subtle material grain (standard folklore
// primitive; different expression family from Paper's per-pixel sine hash).
float heatmapGrainHash(vec2 p) {
  vec3 q = fract(p.xyx * vec3(0.1031, 0.1030, 0.0973));
  q += dot(q, q.yzx + 33.33);
  return fract((q.x + q.y) * q.z);
}

// Rounded Main Window shell (renderer-local projection of the real 200x200 /
// 16px boundary): analytic rounded-rect SDF, <= 0 inside, 0 on the shell.
// The DOM clips the canvas to this exact rounded rect.
float roundedBoundary(vec2 uv) {
  vec2 halfSize = vec2(0.5) - uCornerRadius;
  vec2 qb = abs(uv - 0.5) - halfSize;
  float bd = length(max(qb, vec2(0.0)))
    + min(max(qb.x, qb.y), 0.0) - uCornerRadius;
  return bd;
}

void heatmapOutput(vec2 uv, float t, bool reducedMotion, out vec4 color) {
  // ============ BOUNDARY-DRIVEN THERMAL SOURCE / INFLUENCE FIELD ============
  // The travelling bent contour is a spatial source with ONE broad two-sided
  // finite-support influence. The source travels lower-left -> upper-right;
  // its support fully leaves the window before k=0 and after k=1, and the RM
  // pin k=0.42 places it at the source-space center (developed full-surface).
  // The same sourceInfluence gates the accepted material, the Refraction
  // envelope and localized boundary contact. No half-plane or phase-wide
  // visibility authority remains.
  float k = reducedMotion ? 0.42 : fract(t * 0.13); // one continuous phase (~7.7s)
  float bendTime = reducedMotion ? 0.0 : t;         // RM pins the deformation
  vec2 q = uv - 0.5;                                // centered field coordinate
  const vec2 DIR = vec2(0.8235, 0.5674);            // lower-left -> upper-right
  float p = dot(q, DIR);
  float bend = heatmapBend(q, bendTime);
  // Source travel remapped so the finite support is fully off-window at both
  // k=0 and k=1, with RM k=0.42 at the developed source-space center (0).
  float sourcePosition = mix(-2.985, 4.122, k);
  float d = p + bend - sourcePosition;              // signed distance to source contour
  const float SOURCE_SUPPORT_HALF = 2.2;            // broad support (~1.4x window DIR span)
  float r = abs(d) / SOURCE_SUPPORT_HALF;
  // Squared smoothstep complement: broad flat inner response, exact zero at
  // r >= 1 (every fixed pixel reaches zero from source distance alone).
  float sourceInfluence = 1.0 - smoothstep(0.0, 1.0, r) * smoothstep(0.0, 1.0, r);
  // Contour-local warmth: weak Refraction envelope + real boundary contact
  // bias only. It never contributes to the baseline interior material.
  float warm = exp(-abs(d + 0.018) * 22.0);
  // Rounded boundary (real 200x200/16px shell) contact: intersection of the
  // real boundary band and the source contour, gated by the same influence.
  float bd = roundedBoundary(uv);
  float boundaryBand = smoothstep(-0.05, 0.0, bd) * step(bd, 0.0);
  float contact = boundaryBand * warm * sourceInfluence;
  float capture = contact * 0.6;
  // Broad cool mass: the SAME sourceInfluence forms the continuous symmetric
  // response directly (NOT a swept half-plane). warm is NOT part of the
  // baseline interior material: it is only a weak Refraction envelope + real
  // boundary contact bias, so the interior never shows a source marker in
  // either path.
  float coolMass = sourceInfluence;
  float heat = coolMass * 0.44 + capture;

  // ============ MATERIAL / PALETTE / EDGE REPAIR (color-only) ============
  // (1) Broader cool halo: lift the swept cool mass toward the light
  // blue/cyan band. Interior material is a uniform continuous response
  // (coolMass * 0.62); boundary capture carries the localized temperature.
  float coolLift = coolMass * 0.18;
  float material = clamp(heat + coolLift, 0.0, 1.0);

  // Repaired ramp: dark/deep blue -> vivid blue -> light blue/cyan -> yellow
  // -> orange -> red-orange. Grey/green/teal reduced (blue-dominant cyan,
  // golden yellow); no required white core.
  const vec3 HEAT_STOP[7] = vec3[7](
    vec3(0.010, 0.014, 0.045), // dark navy
    vec3(0.035, 0.090, 0.360), // deep blue
    vec3(0.080, 0.220, 0.680), // vivid blue
    vec3(0.090, 0.400, 0.940), // light blue/cyan (blue-dominant)
    vec3(1.000, 0.800, 0.200), // golden yellow (clear transition)
    vec3(1.000, 0.540, 0.140), // orange
    vec3(1.000, 0.340, 0.090)  // red-orange
  );
  vec3 rgb = HEAT_STOP[0];
  for (int i = 1; i < 7; i++) {
    float m = clamp(material * 6.0 - float(i - 1), 0.0, 1.0);
    rgb = mix(rgb, HEAT_STOP[i], m);
  }
  // Clearer yellow transition: in the cyan -> yellow zone, pull the green
  // channel toward the yellow so the band reads cyan -> golden-yellow instead
  // of a muddy olive.
  float yellowZone = smoothstep(0.40, 0.52, material)
    * (1.0 - smoothstep(0.62, 0.76, material));
  rgb.g = mix(rgb.g, rgb.r * 0.78 + rgb.b * 0.10, yellowZone * 0.9);

  // (3) Edge treatment (contact-gated only, never a perimeter): the localized
  // capture keeps its inward-thick warm compression (capture already feeds
  // heat) and gains a soft cool halo just inward of the contact, continuous
  // with the surface field. No outline, decorative glow, or perimeter coord.
  float inwardCool = contact * smoothstep(-0.16, -0.05, bd);
  rgb = mix(rgb, vec3(0.160, 0.520, 0.900),
    inwardCool * 0.35 * (1.0 - smoothstep(0.45, 0.80, material)));

  // Alpha: the cool body must read clearly over the dark surface.
  float alpha = mix(0.55, 1.0, smoothstep(0.0, 0.5, material));

  // ============ THERMAL REFRACTION (lab-gated, derived mode) ============
  // Clean-room Thermal Refraction spike: a slow, local, analytic resample of
  // the accepted field above. The displacement DIRECTION comes from the
  // finite difference of the existing LOW-frequency heatmapBend (no
  // high-frequency noise); the local intensity ENVELOPE hierarchy is
  // localized contact strongest > warm frontier strong > cool influence weak
  // > sourceInfluence zero -> exactly zero, so refraction never fires
  // pre-contact / post-dissipation and is gated by the same influence as the
  // material. Refraction off (uRefractionMode = 0) keeps the accepted
  // baseline path. No texture, sampler, framebuffer, second pass, or second
  // draw.
  if (uRefractionMode != 0) {
    const float REFRACTION_EPS = 0.02;      // finite-difference step (q units)
    const float REFRACTION_STRENGTH = 0.16; // bounded Lab spike amplitude
    vec2 grad = vec2(
      heatmapBend(q + vec2(REFRACTION_EPS, 0.0), bendTime)
        - heatmapBend(q - vec2(REFRACTION_EPS, 0.0), bendTime),
      heatmapBend(q + vec2(0.0, REFRACTION_EPS), bendTime)
        - heatmapBend(q - vec2(0.0, REFRACTION_EPS), bendTime)
    ) * (0.5 / REFRACTION_EPS);
    // Expanded local envelope from the SAME source influence: localized
    // boundary contact (boundaryBand*warm) strongest > warm frontier weak >
    // broad cool influence > influence zero -> exactly zero.
    float env = clamp(
      contact + warm * 0.25 + sourceInfluence * 0.30,
      0.0, 1.0
    ) * sourceInfluence;
    // First-order analytic resample at q + grad*s: the signed distance to the
    // source contour shifts (d = p + bend - sourcePosition).
    float s = REFRACTION_STRENGTH * env;
    float dShift = s * (dot(grad, DIR) + dot(grad, grad));
    float d2 = d + dShift;
    float warm2 = exp(-abs(d2 + 0.018) * 22.0);
    // 2D temperature topology: three genuinely distinct coordinate frames
    // (rotation, shear/axis-mix, anisotropic scale) at ~1.6-2.8x so the
    // 200x200 view spans several broad smooth low-frequency lobes instead of
    // one correlated color mass; all samples share bendTime. sourceInfluence
    // answers where Thermal exists; topology answers temperature.
    vec2 pa = vec2(0.8 * q.x - 0.6 * q.y, 0.6 * q.x + 0.8 * q.y) * 2.2 + vec2(0.30, -0.20);
    vec2 pb = vec2(q.x + 0.45 * q.y, q.y - 0.35 * q.x) * 2.8 + vec2(-0.25, 0.35);
    vec2 pc = vec2(q.x * 1.7, q.y * 0.9) * 1.6 + vec2(0.10, 0.40);
    float baseA = heatmapBend(pa, bendTime) * 16.0;
    float baseB = heatmapBend(pb, bendTime) * 16.0;
    float baseC = heatmapBend(pc, bendTime) * 16.0;
    float baseT = clamp(baseA * 0.45 + baseB * 0.35 + baseC * 0.20, -1.0, 1.0);
    // heatmapBend's swell/curl are negative-biased in the visible window
    // (weighted signal ~[-0.078, +0.029], median ~-0.035), so re-center by
    // +0.24: the concentrated bulk lands in the cyan/yellow mid-ramp, the
    // negative tail stays deep/vivid blue, and the positive tail becomes a
    // yellow/orange gradient with localized red-orange (no broad hot board).
    float baseTemperature = clamp(0.5 + 0.5 * baseT + 0.24, 0.0, 1.0);
    float contact2 = boundaryBand * warm2;
    // Boundary contact stays hottest without adding an interior source marker;
    // the same sourceInfluence gates material to the active region.
    float material2 = clamp(
      mix(0.08, 0.93, baseTemperature) + contact2 * 0.22,
      0.0, 1.0
    );
    vec3 rgb2 = HEAT_STOP[0];
    for (int i = 1; i < 7; i++) {
      float m = clamp(material2 * 6.0 - float(i - 1), 0.0, 1.0);
      rgb2 = mix(rgb2, HEAT_STOP[i], m);
    }
    float yellowZone2 = smoothstep(0.40, 0.52, material2)
      * (1.0 - smoothstep(0.62, 0.76, material2));
    rgb2.g = mix(rgb2.g, rgb2.r * 0.78 + rgb2.b * 0.10, yellowZone2 * 0.9);
    float inwardCool2 = contact2 * smoothstep(-0.16, -0.05, bd);
    rgb2 = mix(rgb2, vec3(0.160, 0.520, 0.900),
      inwardCool2 * 0.35 * (1.0 - smoothstep(0.45, 0.80, material2)));
    float alpha2 = mix(0.55, 1.0, smoothstep(0.0, 0.5, material2));
    // Material visibility is decoupled from the (weaker) distortion envelope:
    // the SAME source influence gates the 2D field; influence=0 -> no new
    // material and no Refraction.
    float materialMix = sourceInfluence;
    rgb = mix(rgb, rgb2, materialMix);
    alpha = mix(alpha, alpha2, materialMix);
  }
  // Subtle sine-free grain so flat gradients read as material.
  rgb += (heatmapGrainHash(uv * 311.0 + 17.0) - 0.5) * 0.02;

  color = vec4(rgb, alpha);
}

// ---- Paper processed-silhouette mode (lab-only, STATIC mechanics) ----
// One lazy Lab-only processed RGBA texture uPaperBoundary built by CPU
// preprocessing from the EXACT 200x200/r16 panel mask at outer origin
// (14,14): R=source coverage, G=big broad field, B=narrow field, A=contour
// edge response. The shader samples it in the FULL canvas domain (the Lab
// canvas spans the 228x228 outer domain) and composes Paper-style scalar
// inner/outer/contour causality, mapped through Ameow's own palette/output.
// REPAIRED (one repair round): tightened processed broad/narrow scales and an
// explicit outer distance falloff bound the halo inside the 14px gutter; the
// contour stays a scalar heat contributor (never a colored ring); the alpha
// ramp removes the 0.55 floor so the exterior halo fades to transparent and
// the panel edge keeps a continuous high-energy gold->orange transition.
// Static: no time, no travelling source, no second draw.
void paperOutput(vec2 uv, out vec4 color) {
  vec4 img = texture(uPaperBoundary, uv);
  float src = img.r;     // exact panel source coverage
  float broad = img.g;   // processed broad field
  float narrow = img.b;  // processed narrow field
  float contour = img.a; // processed contour edge response
  // Analytic cross-check of the exact panel shell (uPaperPanelOrigin/Size/
  // Radius are derived from MAIN_WINDOW_* constants for the canvas domain).
  vec2 halfSize = uPaperPanelSize * 0.5 - uPaperPanelRadius;
  vec2 qb = abs(uv - (uPaperPanelOrigin + uPaperPanelSize * 0.5)) - halfSize;
  float bd = length(max(qb, vec2(0.0))) + min(max(qb.x, qb.y), 0.0) - uPaperPanelRadius;
  float shell = 1.0 - smoothstep(0.0, 0.0035, bd);
  // Paper-derived scalar causality (geometry-agnostic; the Ameow panel is the
  // sole source silhouette): inner response inside the panel driven by the
  // narrow processed field; outer residual into the real gutter driven by the
  // broad processed field, gated by an explicit distance falloff so it
  // reaches ~0 inside the 14px gutter (gutter width derived from the panel
  // size in this domain); contour stays a scalar heat contributor only and is
  // never mapped into its own colored ring.
  float inner = mix(0.14, 0.92, narrow) * src;
  float gutter = (1.0 - uPaperPanelSize.x) * 0.5;
  float gutterNorm = clamp(bd / max(gutter, 1e-5), 0.0, 1.0);
  float outerFalloff = 1.0 - smoothstep(0.0, 1.0, gutterNorm);
  float outer = 0.30 * broad * (1.0 - src) * outerFalloff;
  float heat = clamp(inner + contour * 0.18 + outer, 0.0, 1.0);
  // Existing Ameow material language: same 7-stop ramp, yellow-zone
  // correction, alpha ramp, and grain as the accepted Thermal output.
  const vec3 PAPER_STOP[7] = vec3[7](
    vec3(0.010, 0.014, 0.045),
    vec3(0.035, 0.090, 0.360),
    vec3(0.080, 0.220, 0.680),
    vec3(0.090, 0.400, 0.940),
    vec3(1.000, 0.800, 0.200),
    vec3(1.000, 0.540, 0.140),
    vec3(1.000, 0.340, 0.090)
  );
  vec3 rgb = PAPER_STOP[0];
  for (int i = 1; i < 7; i++) {
    float m = clamp(heat * 6.0 - float(i - 1), 0.0, 1.0);
    rgb = mix(rgb, PAPER_STOP[i], m);
  }
  float yellowZone = smoothstep(0.40, 0.52, heat)
    * (1.0 - smoothstep(0.62, 0.76, heat));
  rgb.g = mix(rgb.g, rgb.r * 0.78 + rgb.b * 0.10, yellowZone * 0.9);
  // Panel interior/edge stay opaque; the exterior halo fades to transparent
  // as heat drops, so it approaches inactive inside the 14px gutter.
  float alpha = smoothstep(0.06, 0.55, heat);
  rgb += (heatmapGrainHash(uv * 311.0 + 17.0) - 0.5) * 0.02;
  color = vec4(rgb, alpha);
}

void main() {
  vec2 centered = vUv - 0.5;
  centered.x *= uResolution.x / max(uResolution.y, 1.0);
  float angle = fract(atan(centered.x, centered.y) / 6.28318530718);
  float track = ring(centered, 0.26, 0.011);
  float arc = 0.0;
  float frontier = 0.0;
  if (uProgressMode == 1) {
    arc = track * arcMask(angle, uProgress);
    // Keep the material strictly behind the authoritative angular frontier.
    frontier = track * exp(-abs(angle - uProgress) * 72.0)
      * arcMask(angle, uProgress) * step(0.002, uProgress);
  } else if (uProgressMode == 2) {
    // Honest indeterminate: one fixed non-percent segment, never a travelling frontier.
    arc = track * step(0.16, angle) * step(angle, 0.42);
  }
  float visibleTrack = uProgressMode == 0 ? 0.0 : track;
  vec3 color = mix(uThermalVoid, uThermalDeep, visibleTrack);
  color = mix(color, uThermalEmber, arc);
  color = mix(color, uThermalGold, frontier);
  float alpha = visibleTrack * 0.14 + arc * 0.34 + frontier * 0.24;

  if (uActivationKind != 0) {
    float phase = clamp(uActivationAge, 0.0, 1.0);
    // DOM client coordinates are top-down; WebGL UV coordinates are bottom-up.
    vec2 interactionUv = vec2(uActivationOrigin.x, 1.0 - uActivationOrigin.y);
    vec2 origin = interactionUv - 0.5;
    origin.x *= uResolution.x / max(uResolution.y, 1.0);
    float distanceFromOrigin = length(centered - origin);
    float intake = uActivationKind == 1 ? 1.0 : 0.0;
    float turbulence = intake * 0.018 * sin((centered.y + uTime) * 42.0);
    float ignition = (1.0 - smoothstep(
      0.015,
      mix(0.12, 0.2, smoothstep(0.0, 0.28, phase)),
      distanceFromOrigin + turbulence
    )) * (1.0 - smoothstep(0.18, 0.46, phase));
    float sweepLimit = mix(0.76, 0.9, intake);
    float sweep = exp(-abs(
      distanceFromOrigin - mix(0.03, sweepLimit, smoothstep(0.08, 0.52, phase))
    ) * mix(24.0, 19.0, intake));
    float perimeter = edgeMask(vUv, mix(0.04, 0.032, intake));
    float perimeterPosition = perimeterCoordinate(vUv);
    float originPosition = perimeterCoordinate(interactionUv);
    float chaseDistance = mix(0.0, 0.5, smoothstep(0.34, 0.72, phase));
    float dualFrontDistance = min(
      angularDistance(perimeterPosition, originPosition + chaseDistance),
      angularDistance(perimeterPosition, originPosition - chaseDistance)
    );
    float capturedDistance = angularDistance(perimeterPosition, originPosition);
    float capturedEdge = perimeter
      * (1.0 - smoothstep(max(chaseDistance - 0.035, 0.0), chaseDistance + 0.02, capturedDistance))
      * smoothstep(0.24, 0.42, phase);
    float edgeFronts = perimeter * (1.0 - smoothstep(0.025, 0.075, dualFrontDistance));
    float oppositeDistance = angularDistance(perimeterPosition, originPosition + 0.5);
    float oppositeClosure = perimeter
      * (1.0 - smoothstep(0.02, 0.1, oppositeDistance))
      * phasePulse(phase, 0.62, 0.74, 0.86);
    float convergence = exp(-length(centered) * 17.0)
      * phasePulse(phase, 0.7, 0.79, 0.89);
    float dissipate = 1.0 - smoothstep(0.78, 1.0, phase);
    float travellingThermal = max(
      ignition,
      max(
        sweep * mix(0.64, 0.78, intake),
        max(
          capturedEdge * mix(0.86, 0.68, intake),
          max(edgeFronts * 0.74, max(oppositeClosure * 0.82, convergence * 0.52))
        )
      )
    ) * dissipate;
    float reducedIntake = max(
      1.0 - smoothstep(0.035, 0.17, distanceFromOrigin),
      ring(centered - origin, 0.18, 0.022) * 0.5
    );
    float reducedFolderLock = perimeter
      * (1.0 - smoothstep(0.025, 0.12, oppositeDistance));
    float reducedFolder = max(perimeter * 0.55, reducedFolderLock * 0.82);
    float thermal = uReducedMotion
      ? mix(reducedFolder, reducedIntake, intake)
      : travellingThermal;
    vec3 activationColor = mix(uThermalDeep, uThermalEmber, smoothstep(0.08, 0.42, thermal));
    activationColor = mix(activationColor, uThermalFlare, smoothstep(0.35, 0.68, thermal));
    activationColor = mix(activationColor, uThermalGold, smoothstep(0.66, 0.86, thermal));
    color = mix(activationColor, uThermalCore, smoothstep(0.86, 0.98, thermal));
    alpha = max(alpha * 0.35, thermal * (uReducedMotion ? 0.24 : 0.72));
  }
  if (uPaperMode != 0) {
    // Lab-only Paper processed-silhouette mode overrides the whole surface;
    // static mechanics spike with its own ramp (PAPER_STOP) so the accepted
    // Thermal/Refraction paths stay untouched.
    paperOutput(vUv, outColor);
    return;
  }
  if (uHeatmapMode != 0) {
    // Heatmap spike overrides the whole surface; the palette ramp is
    // self-contained so the production thermal palette stays untouched.
    heatmapOutput(vUv, uTime, uReducedMotion, outColor);
    return;
  }
  outColor = vec4(color, alpha);
}`;

// ---------------------------------------------------------------------------
// EXACT copy of the Paper processed-silhouette CPU preprocessing from
// ExpandedPresentationSurface.tsx (integral-image box blur + multi-pass,
// derivative-adapted from Paper Heatmap's geometry-agnostic preprocessing).
// REPAIRED: big/narrow blur fractions tightened to 0.03 (halo bounded inside
// the 14px gutter).
// ---------------------------------------------------------------------------
const PAPER_BIG_BLUR_FRACTION = 0.03;
const PAPER_NARROW_BLUR_FRACTION = 0.03;
const PAPER_BLUR_PASSES = 3;

const paperClamp01 = (value) => Math.min(Math.max(value, 0), 1);

const rasterizeRoundedRectMask = (width, height, originX, originY, sizeX, sizeY, radius) => {
  const mask = new Float32Array(width * height);
  const radiusClamped = Math.max(0, Math.min(radius, sizeX / 2, sizeY / 2));
  const halfX = sizeX / 2;
  const halfY = sizeY / 2;
  const centerX = originX + halfX;
  const centerY = originY + halfY;
  const superSamples = 3;
  for (let py = 0; py < height; py += 1) {
    for (let px = 0; px < width; px += 1) {
      let coverage = 0;
      for (let sy = 0; sy < superSamples; sy += 1) {
        for (let sx = 0; sx < superSamples; sx += 1) {
          const fx = px + (sx + 0.5) / superSamples;
          const fy = py + (sy + 0.5) / superSamples;
          const qx = Math.abs(fx - centerX) - (halfX - radiusClamped);
          const qy = Math.abs(fy - centerY) - (halfY - radiusClamped);
          const distance = Math.sqrt(Math.max(qx, 0) ** 2 + Math.max(qy, 0) ** 2)
            + Math.min(Math.max(qx, qy), 0);
          coverage += paperClamp01(0.5 - (distance - radiusClamped));
        }
      }
      mask[py * width + px] = coverage / (superSamples * superSamples);
    }
  }
  return mask;
};

const boxBlurGray = (source, width, height, radius) => {
  const integral = new Float32Array((width + 1) * (height + 1));
  for (let y = 0; y < height; y += 1) {
    for (let x = 0; x < width; x += 1) {
      const value = source[y * width + x];
      integral[(y + 1) * (width + 1) + (x + 1)] =
        value
        + integral[y * (width + 1) + (x + 1)]
        + integral[(y + 1) * (width + 1) + x]
        - integral[y * (width + 1) + x];
    }
  }
  const radiusClamped = Math.max(1, Math.round(radius));
  const blurred = new Float32Array(width * height);
  for (let y = 0; y < height; y += 1) {
    for (let x = 0; x < width; x += 1) {
      const x0 = Math.max(0, x - radiusClamped);
      const x1 = Math.min(width - 1, x + radiusClamped);
      const y0 = Math.max(0, y - radiusClamped);
      const y1 = Math.min(height - 1, y + radiusClamped);
      const sum =
        integral[(y1 + 1) * (width + 1) + (x1 + 1)]
        - integral[y0 * (width + 1) + (x1 + 1)]
        - integral[(y1 + 1) * (width + 1) + x0]
        + integral[y0 * (width + 1) + x0];
      const count = (x1 - x0 + 1) * (y1 - y0 + 1);
      blurred[y * width + x] = sum / count;
    }
  }
  return blurred;
};

const multiPassBlurGray = (source, width, height, radius, passes) => {
  let current = source;
  for (let pass = 0; pass < passes; pass += 1) {
    current = boxBlurGray(current, width, height, radius);
  }
  return current;
};

const buildPaperBoundary = (width, height, originX, originY, sizeX, sizeY, radius) => {
  const source = rasterizeRoundedRectMask(width, height, originX, originY, sizeX, sizeY, radius);
  const big = multiPassBlurGray(source, width, height, sizeX * PAPER_BIG_BLUR_FRACTION, PAPER_BLUR_PASSES);
  const narrow = multiPassBlurGray(source, width, height, sizeX * PAPER_NARROW_BLUR_FRACTION, PAPER_BLUR_PASSES);
  const rgba = new Uint8Array(width * height * 4);
  for (let index = 0; index < width * height; index += 1) {
    rgba[index * 4 + 0] = Math.round(paperClamp01(source[index]) * 255);
    rgba[index * 4 + 1] = Math.round(paperClamp01(big[index]) * 255);
    rgba[index * 4 + 2] = Math.round(paperClamp01(narrow[index]) * 255);
    rgba[index * 4 + 3] = Math.round(paperClamp01((source[index] - narrow[index]) * 3.0) * 255);
  }
  return rgba;
};

// ---------------------------------------------------------------------------
// Harness: 228x228 CSS canvas, 4x ABSOLUTE backing = 912x912 (same as a 4x
// Lab PNG export of the 228 outer domain). Panel at backing (56,56,800,800),
// radius 64 backing px (16 CSS px at 4x). Uniforms derived exactly like the
// production renderer: origin=(css-200)/2, size=200/css, radius=16/css.
// ---------------------------------------------------------------------------
const CSS = 228;
const SCALE = 4;
const W = CSS * SCALE;   // 912
const H = W;

const framesEl = document.getElementById("frames");
const evidenceEl = document.getElementById("evidence");
const statusEl = document.getElementById("status");

const log = (html) => { evidenceEl.insertAdjacentHTML("beforeend", `<div>${html}</div>`); };

const canvas = document.createElement("canvas");
canvas.width = W;
canvas.height = H;
canvas.style.width = CSS + "px";
canvas.style.height = CSS + "px";
document.body.appendChild(canvas);

const gl = canvas.getContext("webgl2");
if (gl === null) { statusEl.textContent = "FAIL: no WebGL2"; throw new Error("no webgl2"); }

// Counters (one canvas / one program / one drawArrays / one createTexture).
let createTextureCount = 0;
const realCreateTexture = gl.createTexture.bind(gl);
gl.createTexture = (...a) => { createTextureCount += 1; return realCreateTexture(...a); };
let drawArraysCount = 0;
const realDrawArrays = gl.drawArrays.bind(gl);
gl.drawArrays = (...a) => { drawArraysCount += 1; return realDrawArrays(...a); };

const panelOriginCss = Math.max(0, (CSS - 200) / 2); // 14
const uPaperPanelOrigin = panelOriginCss / CSS;
const uPaperPanelSize = 200 / CSS;
const uPaperPanelRadius = 16 / CSS;

const PALETTE = {
  thermalVoid: [0.12549, 0.11765, 0.14510],
  thermalDeep: [0.01569, 0.05098, 0.17255],
  thermalEmber: [0.38039, 0.58824, 0.95294],
  thermalFlare: [0.55294, 0.82745, 0.97647],
  thermalGold: [0.99216, 0.76863, 0.32157],
  thermalCore: [1.0, 0.48627, 0.18431],
};

let program = null;
let loc = {};
let boundaryTexture = null;
let programCount = 0;

const compileShader = (type, source) => {
  const shader = gl.createShader(type);
  gl.shaderSource(shader, source);
  gl.compileShader(shader);
  if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
    throw new Error(gl.getShaderInfoLog(shader) || "compile error");
  }
  return shader;
};

const install = () => {
  if (program !== null) gl.deleteProgram(program);
  if (boundaryTexture !== null) { gl.deleteTexture(boundaryTexture); boundaryTexture = null; }
  const vs = compileShader(gl.VERTEX_SHADER, VERT);
  const fs = compileShader(gl.FRAGMENT_SHADER, FRAG);
  program = gl.createProgram();
  programCount += 1;
  gl.attachShader(program, vs);
  gl.attachShader(program, fs);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
    throw new Error(gl.getProgramInfoLog(program) || "link error");
  }
  gl.deleteShader(vs);
  gl.deleteShader(fs);
  gl.useProgram(program);
  const names = [
    "uResolution", "uTime", "uProgress", "uProgressMode", "uReducedMotion",
    "uActivationAge", "uActivationKind", "uActivationOrigin",
    "uHeatmapMode", "uRefractionMode", "uPaperMode",
    "uPaperPanelOrigin", "uPaperPanelSize", "uPaperPanelRadius", "uPaperBoundary",
    "uCornerRadius", "uThermalVoid", "uThermalDeep", "uThermalEmber",
    "uThermalFlare", "uThermalGold", "uThermalCore",
  ];
  loc = {};
  for (const name of names) loc[name] = gl.getUniformLocation(program, name);
  gl.disable(gl.DEPTH_TEST);
  gl.enable(gl.BLEND);
  gl.blendFunc(gl.SRC_ALPHA, gl.ONE_MINUS_SRC_ALPHA);
  gl.viewport(0, 0, W, H);
};

const ensurePaperBoundary = () => {
  if (boundaryTexture !== null) return;
  const panelOriginPx = panelOriginCss * SCALE;      // 56
  const panelSizePx = 200 * SCALE;                   // 800
  const panelRadiusPx = 16 * SCALE;                  // 64
  const rgba = buildPaperBoundary(W, H, panelOriginPx, panelOriginPx, panelSizePx, panelSizePx, panelRadiusPx);
  const texture = gl.createTexture();
  gl.bindTexture(gl.TEXTURE_2D, texture);
  gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, W, H, 0, gl.RGBA, gl.UNSIGNED_BYTE, rgba);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  boundaryTexture = texture;
};

const readPixels = () => {
  const pixels = new Uint8Array(W * H * 4);
  gl.readPixels(0, 0, W, H, gl.RGBA, gl.UNSIGNED_BYTE, pixels);
  return pixels;
};

const draw = (opts) => {
  drawArraysCount = 0;
  gl.useProgram(program);
  gl.uniform2f(loc.uResolution, W, H);
  gl.uniform1f(loc.uTime, opts.time ?? 0);
  gl.uniform1f(loc.uProgress, opts.progress ?? 0);
  gl.uniform1i(loc.uProgressMode, opts.progressMode ?? 0);
  gl.uniform1i(loc.uReducedMotion, opts.reducedMotion ? 1 : 0);
  gl.uniform1f(loc.uActivationAge, 1);
  gl.uniform1i(loc.uActivationKind, 0);
  gl.uniform2f(loc.uActivationOrigin, 0.5, 0.5);
  gl.uniform1i(loc.uHeatmapMode, opts.heatmap ? 1 : 0);
  gl.uniform1i(loc.uRefractionMode, opts.refraction ? 1 : 0);
  gl.uniform1i(loc.uPaperMode, opts.paper ? 1 : 0);
  if (opts.paper) {
    ensurePaperBoundary();
    gl.uniform2f(loc.uPaperPanelOrigin, uPaperPanelOrigin, uPaperPanelOrigin);
    gl.uniform2f(loc.uPaperPanelSize, uPaperPanelSize, uPaperPanelSize);
    gl.uniform1f(loc.uPaperPanelRadius, uPaperPanelRadius);
    gl.activeTexture(gl.TEXTURE0);
    gl.bindTexture(gl.TEXTURE_2D, boundaryTexture);
    gl.uniform1i(loc.uPaperBoundary, 0);
  }
  gl.uniform1f(loc.uCornerRadius, 16 / 200);
  gl.uniform3fv(loc.uThermalVoid, PALETTE.thermalVoid);
  gl.uniform3fv(loc.uThermalDeep, PALETTE.thermalDeep);
  gl.uniform3fv(loc.uThermalEmber, PALETTE.thermalEmber);
  gl.uniform3fv(loc.uThermalFlare, PALETTE.thermalFlare);
  gl.uniform3fv(loc.uThermalGold, PALETTE.thermalGold);
  gl.uniform3fv(loc.uThermalCore, PALETTE.thermalCore);
  gl.clearColor(0, 0, 0, 0);
  gl.clear(gl.COLOR_BUFFER_BIT);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  return readPixels();
};

const px = (pixels, x, y) => {
  const row = H - 1 - y; // readPixels is bottom-up; convert to top-down (x, y)
  const i = (row * W + x) * 4;
  return [pixels[i], pixels[i + 1], pixels[i + 2], pixels[i + 3]];
};

const hex = (c) => "#" + [c[0], c[1], c[2]].map((v) => v.toString(16).padStart(2, "0")).join("");

// Precompute channels once (CPU cross-check + visualizations).
const CHANNELS = (() => {
  const source = rasterizeRoundedRectMask(W, H, 56, 56, 800, 800, 64);
  const big = multiPassBlurGray(source, W, H, 800 * PAPER_BIG_BLUR_FRACTION, PAPER_BLUR_PASSES);
  const narrow = multiPassBlurGray(source, W, H, 800 * PAPER_NARROW_BLUR_FRACTION, PAPER_BLUR_PASSES);
  return { source, big, narrow };
})();

const addCanvas = (w, h, label, paint) => {
  const wrap = document.createElement("div");
  const cap = document.createElement("div");
  cap.textContent = label;
  const cv = document.createElement("canvas");
  cv.width = w; cv.height = h;
  cv.style.width = Math.round(w / 4) + "px";
  cv.style.height = Math.round(h / 4) + "px";
  const ctx = cv.getContext("2d");
  paint(ctx, w, h);
  wrap.appendChild(cap);
  wrap.appendChild(cv);
  framesEl.appendChild(wrap);
};

const paintChannel = (channel, scale) => (ctx, w, h) => {
  const img = ctx.createImageData(w, h);
  for (let y = 0; y < h; y += 1) {
    for (let x = 0; x < w; x += 1) {
      const v = Math.round(paperClamp01(channel[y * w + x] * scale) * 255);
      const i = (y * w + x) * 4;
      img.data[i] = v; img.data[i + 1] = v; img.data[i + 2] = v; img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
};

// ---- Captures ----
install();
const paperPixels = draw({ paper: true, reducedMotion: false, time: 1.23 });
window.__paperPixels = paperPixels;
window.__draw = draw;
window.__px = px;
window.__hex = hex;
window.__channels = CHANNELS;
window.__W = W;
window.__H = H;
window.__SCALE = SCALE;
const paperDrawCount = drawArraysCount;
const paperCreateTexture = createTextureCount;

const centerY = H / 2;
const scanX = [28, 55, 56, 57, 100, 456, 812, 855, 856, 857, 884, 900, 908, 910, 911];
const scanRows = scanX.map((x) => {
  const c = px(paperPixels, x, centerY);
  const src = CHANNELS.source[centerY * W + x];
  const broad = CHANNELS.big[centerY * W + x];
  const narrow = CHANNELS.narrow[centerY * W + x];
  return { x, cssX: +(x / SCALE).toFixed(1), rgba: c, hex: hex(c), alpha: c[3],
    cpuSrc: src.toFixed(3), cpuBroad: broad.toFixed(3), cpuNarrow: narrow.toFixed(3),
    cpuContour: paperClamp01((src - narrow) * 3.0).toFixed(3) };
});

const cornerPixels = {
  topLeft: px(paperPixels, 0, 0),
  bottomRight: px(paperPixels, 911, 911),
  gutterMidLeft: px(paperPixels, 28, centerY),
  gutterMidRight: px(paperPixels, 884, centerY),
  panelCornerOuter: px(paperPixels, 56, 56),
  panelCenter: px(paperPixels, 456, 456),
};
const gutterLast2px = {
  rightBottom: [908, 909, 910, 911].map((x) => px(paperPixels, x, centerY)),
  top: [0, 1, 2, 3].map((y) => px(paperPixels, 456, y)),
  corner: px(paperPixels, 911, 911),
};

// All four sides: last-2px alpha and gutter decay profile (distance from the
// 228 canvas edge inward, backing px -> css px).
const sideProbe = (dir, near) => {
  const at = (off) => {
    if (dir === "left") return px(paperPixels, off, near);
    if (dir === "right") return px(paperPixels, 911 - off, near);
    if (dir === "top") return px(paperPixels, near, off);
    return px(paperPixels, near, 911 - off);
  };
  return {
    last2: [0, 1].map((o) => { const v = at(o); return [hex(v), v[3]]; }),
    gutterProfile: [2, 4, 6, 8, 10, 12, 13, 14].map((d) => { const v = at(d); return [d, (d / SCALE).toFixed(1), hex(v), v[3]]; }),
  };
};
const fourSides = {
  left: sideProbe("left", 456),
  right: sideProbe("right", 456),
  top: sideProbe("top", 456),
  bottom: sideProbe("bottom", 456),
  leftTopCorner: sideProbe("left", 90),
  topLeftCorner: sideProbe("top", 90),
};
const fourCorners = {
  canvas: { tl: hex(px(paperPixels, 0, 0)), tr: hex(px(paperPixels, 911, 0)), bl: hex(px(paperPixels, 0, 911)), br: hex(px(paperPixels, 911, 911)) },
  panelRounded: { tl: hex(px(paperPixels, 56, 56)), tr: hex(px(paperPixels, 855, 56)), bl: hex(px(paperPixels, 56, 855)), br: hex(px(paperPixels, 855, 855)) },
};
const edgeBandLeft = [52, 53, 54, 55, 56, 57, 58, 60, 70, 80].map((x) => {
  const v = px(paperPixels, x, centerY);
  return [x, (x / SCALE).toFixed(1), hex(v), v[3]];
});
const interior = {
  center: hex(px(paperPixels, 456, 456)),
  midLeft: hex(px(paperPixels, 228, 456)),
  midTop: hex(px(paperPixels, 456, 228)),
  nearEdgeIn: hex(px(paperPixels, 60, 456)),
};

// Reduced Motion static: two different times must be pixel-identical.
const rmA = draw({ paper: true, reducedMotion: true, time: 0 });
const rmB = draw({ paper: true, reducedMotion: true, time: 3.7 });
let rmDiff = 0;
for (let i = 0; i < rmA.length; i += 1) if (rmA[i] !== rmB[i]) rmDiff += 1;

// Fallback: production thermal path (paper OFF). Must differ and allocate
// NO boundary texture.
const beforeFallback = createTextureCount;
const fallbackPixels = draw({ paper: false, reducedMotion: false, time: 0, progress: 0.5, progressMode: 1 });
const fallbackCreateTexture = createTextureCount - beforeFallback;
let fallbackDiff = 0;
for (let i = 0; i < fallbackPixels.length; i += 1) if (fallbackPixels[i] !== paperPixels[i]) fallbackDiff += 1;

// Visualizations (persistent 2D canvases).
addCanvas(W, H, "composite paper-static (4x backing) — REPAIRED", (ctx, w, h) => {
  const img = ctx.createImageData(w, h);
  img.data.set(paperPixels);
  ctx.putImageData(img, 0, 0);
});
addCanvas(W, H, "R = exact panel source coverage", paintChannel(CHANNELS.source, 1));
addCanvas(W, H, "G = broad processed field (x1)", paintChannel(CHANNELS.big, 1));
addCanvas(W, H, "B = narrow processed field (x1)", paintChannel(CHANNELS.narrow, 1));
addCanvas(W, H, "A = contour edge response (x1)", (ctx, w, h) => {
  const img = ctx.createImageData(w, h);
  for (let y = 0; y < h; y += 1) {
    for (let x = 0; x < w; x += 1) {
      const v = Math.round(paperClamp01((CHANNELS.source[y * w + x] - CHANNELS.narrow[y * w + x]) * 3.0) * 255);
      const i = (y * w + x) * 4;
      img.data[i] = v; img.data[i + 1] = v; img.data[i + 2] = v; img.data[i + 3] = 255;
    }
  }
  ctx.putImageData(img, 0, 0);
});

statusEl.textContent = "done";

const summary = {
  geometry: { css: CSS, scale: SCALE, backing: W, panelCss: 200, panelBacking: 800, originCss: 14, originBacking: 56, radiusCss: 16, radiusBacking: 64 },
  counts: { canvases: document.querySelectorAll("canvas").length, programs: programCount, createTexture: createTextureCount, drawArrays: paperDrawCount },
  scanline: scanRows,
  corners: Object.fromEntries(Object.entries(cornerPixels).map(([k, v]) => [k, [v, hex(v)]])),
  gutterLast2px: {
    rightBottom: gutterLast2px.rightBottom.map((v) => [v, hex(v)]),
    top: gutterLast2px.top.map((v) => [v, hex(v)]),
    corner: [gutterLast2px.corner, hex(gutterLast2px.corner)],
  },
  fourSides,
  fourCorners,
  edgeBandLeft,
  interior,
  rmStatic: { diffBytes: rmDiff, identical: rmDiff === 0 },
  fallback: { createTextureDelta: fallbackCreateTexture, diffBytesVsPaper: fallbackDiff, differs: fallbackDiff > 0 },
};
window.__paperSummary = summary;
log("<h4>Summary</h4><pre>" + JSON.stringify(summary, null, 2) + "</pre>");

// Context loss + restore (mirrors the production reinstall path).
const loseExt = gl.getExtension("WEBGL_lose_context");
if (loseExt !== null) {
  loseExt.loseContext();
  canvas.addEventListener("webglcontextrestored", () => {
    const before = createTextureCount;
    install();
    const afterInstall = createTextureCount - before;
    const rp = draw({ paper: true, reducedMotion: false, time: 5 });
    const restored = { afterInstall, totalCreateTexture: createTextureCount, centerRGBA: px(rp, 456, 456), centerHex: hex(px(rp, 456, 456)) };
    window.__paperRestored = restored;
    log("<h4>Context restore</h4><pre>" + JSON.stringify(restored, null, 2) + "</pre>");
  }, { once: true });
  loseExt.restoreContext();
} else {
  log("<h4>Context restore</h4>WEBGL_lose_context unavailable — skipped.");
}
// __HARNESS_JS__
</script>
</body>
</html>
