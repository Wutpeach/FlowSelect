<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>gpu-paper-morphology</title>
</head>
<body>
<canvas id="c" width="912" height="912" style="width:228px;height:228px"></canvas>
<pre id="o"></pre>
<script>
// Self-contained GPU validation harness for the Paper Internal Morphology /
// Fixed-Phase Composition spike. Embeds the EXACT paper slice GLSL
// (paperShadowBlob + paperOutput) from
// src/presentation/main-window/ExpandedPresentationSurface.tsx (comments
// elided for embedding only; code verbatim). 912x912 backing = 228 css px
// domain x4. Runs the same CPU preprocessing (rounded-rect mask at
// (14,14)/200x200/r16, boxBlurGray x4 passes at 0.08 / 0.02) and uploads a
// single RGBA processed texture. Counts gl.createTexture / gl.drawArrays.
// Draws fixed phases A=0.05 B=0.32 C=0.58 D=0.82, verifies Reduced-Motion
// static (two draws of same phase => 0 diff bytes) and Paper-off fallback
// (0 extra texture allocations, dark reference output).
const VERT='#version 300 es\nprecision highp float;\nconst vec2 POSITIONS[3] = vec2[3](vec2(-1.0, -1.0), vec2(3.0, -1.0), vec2(-1.0, 3.0));\nout vec2 vUv;\nvoid main() { vec2 position = POSITIONS[gl_VertexID]; vUv = position * 0.5 + 0.5; gl_Position = vec4(position, 0.0, 1.0); }';
const FRAG='#version 300 es\nprecision highp float;\nin vec2 vUv;\nout vec4 outColor;\nuniform vec2 uResolution;\nuniform int uPaperMode;\nuniform vec2 uPaperPanelOrigin;\nuniform vec2 uPaperPanelSize;\nuniform float uPaperPanelRadius;\nuniform sampler2D uPaperBoundary;\nuniform float uPaperPhase;\nfloat heatmapGrainHash(vec2 p) { vec3 q = fract(p.xyx * vec3(0.1031, 0.1030, 0.0973)); q += dot(q, q.yzx + 33.33); return fract((q.x + q.y) * q.z); }\nfloat paperShadowBlob(vec2 uv, float phase) {\n  vec2 scaledUV = uv; float posY = mix(-1.0, 2.0, phase);\n  float mainCircleScale = smoothstep(0.0, 0.8, posY) * (1.0 - smoothstep(0.9, 1.4, posY));\n  scaledUV.y -= 0.5; scaledUV *= vec2(1.0, 1.0 + 1.5 * mainCircleScale); scaledUV.y += 0.5;\n  float innerR = 0.4; float outerR = 1.0 - 0.3 * (smoothstep(0.1, 0.2, phase) * (1.0 - smoothstep(0.2, 0.5, phase)));\n  float s = 1.0 - smoothstep(innerR, outerR, length(scaledUV - vec2(0.5, posY - 0.2)));\n  s = pow(s, 1.4); s *= 1.2;\n  float pos = posY - uv.y;\n  float topFlattener = clamp((pos + 0.4) / 0.4, 0.0, 1.0) * (1.0 - smoothstep(0.0, 1.2, pos));\n  topFlattener = pow(topFlattener, 3.0);\n  float topFlattenerMixer = 1.0 - smoothstep(0.0, 0.3, pos);\n  s = mix(topFlattener, s, topFlattenerMixer);\n  return clamp(s, 0.0, 1.0);\n}\nvoid paperOutput(vec2 uv, float phase, out vec4 color) {\n  vec4 img = texture(uPaperBoundary, uv);\n  float shape = img.r; float bigBlur = img.g; float narrowBlur = img.b; float contour = img.a;\n  vec2 halfSize = uPaperPanelSize * 0.5 - uPaperPanelRadius;\n  vec2 qb = abs(uv - (uPaperPanelOrigin + uPaperPanelSize * 0.5)) - halfSize;\n  float bd = length(max(qb, vec2(0.0))) + min(max(qb.x, qb.y), 0.0) - uPaperPanelRadius;\n  vec2 panelUv = clamp((uv - uPaperPanelOrigin) / uPaperPanelSize, 0.0, 1.0);\n  float phase1 = fract(phase); float phase2 = fract(phase + 1.0 / 3.0); float phase3 = fract(phase + 2.0 / 3.0);\n  float outerBlur = 1.0 - mix(1.0, bigBlur, shape);\n  float innerBlur = mix(0.0, bigBlur, shape);\n  float inner = 0.8 + 0.8 * innerBlur;\n  float shadow1 = paperShadowBlob(panelUv, phase1);\n  float shadow2 = paperShadowBlob(panelUv, phase2);\n  float shadow3 = paperShadowBlob(panelUv, phase3);\n  float shadowUnion = max(shadow1, max(shadow2, shadow3));\n  inner = mix(inner, 0.0, shadow1); inner = mix(inner, 0.0, shadow2); inner = mix(inner, 0.0, shadow3);\n  inner += 2.0 * 0.12 * contour * (1.0 - shadowUnion);\n  inner = min(1.0, inner); inner *= shape;\n  float outer = 0.0;\n  { float t = mod(3.0 * phase - 0.1, 1.0); outer = 0.9 * pow(outerBlur, 0.8); float y = mod(panelUv.y - t, 1.0); float animatedMask = smoothstep(0.3, 0.65, y) * (1.0 - smoothstep(0.65, 1.0, y)); animatedMask = 0.5 + animatedMask; outer *= animatedMask; outer *= 0.22; }\n  inner = pow(inner, 1.2);\n  float gutter = (1.0 - uPaperPanelSize.x) * 0.5;\n  float gutterNorm = clamp(bd / max(gutter, 1e-5), 0.0, 1.0);\n  float outerFalloff = 1.0 - smoothstep(0.0, 1.0, gutterNorm);\n  float gutterHalo = 0.30 * bigBlur * (1.0 - shape) * outerFalloff;\n  float heat = clamp(inner + outer + gutterHalo, 0.0, 1.0);\n  const vec3 PAPER_STOP[7] = vec3[7](vec3(0.010, 0.014, 0.045), vec3(0.035, 0.090, 0.360), vec3(0.080, 0.220, 0.680), vec3(0.090, 0.400, 0.940), vec3(1.000, 0.800, 0.200), vec3(1.000, 0.540, 0.140), vec3(1.000, 0.340, 0.090));\n  vec3 rgb = PAPER_STOP[0];\n  for (int i = 1; i < 7; i++) { float m = clamp(heat * 6.0 - float(i - 1), 0.0, 1.0); rgb = mix(rgb, PAPER_STOP[i], m); }\n  float yellowZone = smoothstep(0.40, 0.52, heat) * (1.0 - smoothstep(0.62, 0.76, heat));\n  rgb.g = mix(rgb.g, rgb.r * 0.78 + rgb.b * 0.10, yellowZone * 0.9);\n  float alpha = smoothstep(0.06, 0.55, heat);\n  rgb += (heatmapGrainHash(uv * 311.0 + 17.0) - 0.5) * 0.02;\n  color = vec4(rgb, alpha);\n}\nvoid main() { if (uPaperMode != 0) { paperOutput(vUv, uPaperPhase, outColor); return; } outColor = vec4(0.05, 0.05, 0.1, 1.0); }';
const W=912;
const c01=v=>Math.min(Math.max(v,0),1);
const raster=()=>{const m=new Float32Array(W*W),r=64,cx=456,cy=456;for(let py=0;py<W;py++)for(let px=0;px<W;px++){let cov=0;for(let sy=0;sy<3;sy++)for(let sx=0;sx<3;sx++){const fx=px+(sx+0.5)/3,fy=py+(sy+0.5)/3;const qx=Math.abs(fx-cx)-336,qy=Math.abs(fy-cy)-336;const d=Math.sqrt(Math.max(qx,0)**2+Math.max(qy,0)**2)+Math.min(Math.max(qx,qy),0);cov+=c01(0.5-(d-r));}m[py*W+px]=cov/9;}return m;};
const box=(src,radius)=>{const I=new Float32Array((W+1)*(W+1));for(let y=0;y<W;y++)for(let x=0;x<W;x++){const v=src[y*W+x];I[(y+1)*(W+1)+(x+1)]=v+I[y*(W+1)+(x+1)]+I[(y+1)*(W+1)+x]-I[y*(W+1)+x];}const rr=Math.max(1,Math.round(radius)),o=new Float32Array(W*W);for(let y=0;y<W;y++)for(let x=0;x<W;x++){const x0=Math.max(0,x-rr),x1=Math.min(W-1,x+rr),y0=Math.max(0,y-rr),y1=Math.min(W-1,y+rr);o[y*W+x]=(I[(y1+1)*(W+1)+(x1+1)]-I[y0*(W+1)+(x1+1)]-I[(y1+1)*(W+1)+x0]+I[y0*(W+1)+x0])/((x1-x0+1)*(y1-y0+1));}return o;};
const multi=(src,radius)=>{let c=src;for(let i=0;i<3;i++)c=box(c,radius);return c;};
const source=raster();const big=multi(source,Math.round(800*0.08));const narrow=multi(source,Math.round(800*0.02));
const rgba=new Uint8Array(W*W*4);for(let i=0;i<W*W;i++){rgba[i*4+0]=Math.round(c01(source[i])*255);rgba[i*4+1]=Math.round(c01(big[i])*255);rgba[i*4+2]=Math.round(c01(narrow[i])*255);rgba[i*4+3]=Math.round(c01((source[i]-narrow[i])*3)*255);}
const cv=document.getElementById('c');const gl=cv.getContext('webgl2');
if(gl===null){document.getElementById('o').textContent='NO_WEBGL2';throw new Error('no webgl2');}
let cc=0;const rc=gl.createTexture.bind(gl);gl.createTexture=(...a)=>{cc++;return rc(...a);};
let dc=0;const rd=gl.drawArrays.bind(gl);gl.drawArrays=(...a)=>{dc++;return rd(...a);};
const cs=(type,src)=>{const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error('SHADER:'+gl.getShaderInfoLog(s));return s;};
const prog=gl.createProgram();gl.attachShader(prog,cs(gl.VERTEX_SHADER,VERT));gl.attachShader(prog,cs(gl.FRAGMENT_SHADER,FRAG));gl.linkProgram(prog);
if(!gl.getProgramParameter(prog,gl.LINK_STATUS))throw new Error('LINK:'+gl.getProgramInfoLog(prog));
gl.useProgram(prog);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.viewport(0,0,W,W);
const loc=name=>gl.getUniformLocation(prog,name);
const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);gl.pixelStorei(gl.UNPACK_ALIGNMENT,1);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,W,W,0,gl.RGBA,gl.UNSIGNED_BYTE,rgba);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
const uPSize=200/228,uPOrigin=14/228,uPRadius=16/228;
const drawP=(ph,mode)=>{dc=0;gl.useProgram(prog);gl.uniform2f(loc('uResolution'),W,W);gl.uniform1i(loc('uPaperMode'),mode?1:0);gl.uniform1f(loc('uPaperPhase'),ph);if(mode){gl.uniform2f(loc('uPaperPanelOrigin'),uPOrigin,uPOrigin);gl.uniform2f(loc('uPaperPanelSize'),uPSize,uPSize);gl.uniform1f(loc('uPaperPanelRadius'),uPRadius);gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);gl.uniform1i(loc('uPaperBoundary'),0);}gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT);gl.drawArrays(gl.TRIANGLES,0,3);const p=new Uint8Array(W*W*4);gl.readPixels(0,0,W,W,gl.RGBA,gl.UNSIGNED_BYTE,p);return p;};
const phases=[0.05,0.32,0.58,0.82];
const outs={};
for(const ph of phases){outs['p'+ph]=drawP(ph,true);}
const rmA=drawP(0.58,true),rmB=drawP(0.58,true);let rmDiff=0;for(let i=0;i<rmA.length;i++)if(rmA[i]!==rmB[i])rmDiff++;
const before=cc;const fb=drawP(0.32,false);const fbDelta=cc-before;
const px=(P,x,y)=>{const i=((W-1-y)*W+x)*4;return [P[i],P[i+1],P[i+2],P[i+3]];};
const hex=v=>'#'+[v[0],v[1],v[2]].map(n=>n.toString(16).padStart(2,'0')).join('');
const summary={linked:true,phases,createTexture:cc,drawArrays:dc,rmStatic:{diffBytes:rmDiff,identical:rmDiff===0},fallback:{createTextureDelta:fbDelta,center:hex(px(fb,456,456))},samples:{}};
for(const ph of phases){const P=outs['p'+ph];summary.samples['p'+ph]={center:hex(px(P,456,456)),edge:hex(px(P,456,60)),gutterLast:px(P,911,456),corner:px(P,911,911)};}
window.__gpu={summary,outs};
document.getElementById('o').textContent=JSON.stringify(summary,null,1);
</script>
</body>
</html>
